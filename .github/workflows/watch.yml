name: Check for internships

on:
  schedule:
    - cron: "0 7 * * *"    # 08:00 UK summer time / 07:00 UK winter time
    - cron: "0 16 * * *"   # 17:00 UK summer time / 16:00 UK winter time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write   # save results back to the repository
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: internship-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check careers pages
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CONTACT_EMAIL: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python watch.py

      - name: Save results
        run: |
          git config user.name "internship-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -m "Update listings $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - name: Publish dashboard
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
