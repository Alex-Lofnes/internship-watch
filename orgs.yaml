# Organisations the watcher checks.
#
# Fields
#   name       Shown in emails and on the dashboard
#   url        Homepage or best-known page. If 'careers' is missing, the script
#              looks for a careers/jobs link on this page and remembers it.
#   careers    (optional) Exact pages to scan. Set this whenever the Coverage tab
#              shows an organisation as 'error' or 'no careers page found'.
#   watch_text (optional) Also alert when the wording about applications or
#              deadlines on these pages changes, e.g. "applications are now open".
#   ats        (optional) {type: greenhouse|lever|workable|smartrecruiters|pinpoint, id: ...}
#              Usually detected automatically from links on the careers page.
#   render     (optional) Load the page in a headless browser (for JavaScript-heavy sites).
#   skip       (optional) Reason for not checking this organisation.
#
# Generated from Summer_2027_Policy_Internships.xlsx. Add or remove entries freely.
